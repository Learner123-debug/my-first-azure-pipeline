trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  # --- STAGE 1: THE CI PHASE ---
  - stage: BuildAndPackage
    displayName: '1. Build & Package'
    jobs:
      - job: PackJob
        steps:
          - script: |
              echo "Starting CI Compilation..."
              mkdir -p $(Build.ArtifactStagingDirectory)/site
              cp index.html $(Build.ArtifactStagingDirectory)/site/
            displayName: 'Prepare Website Files'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Website Output'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/site'
              artifact: 'drop-website'
              publishLocation: 'pipeline'

  # --- STAGE 2: THE CD PHASE ---
  - stage: DeployToGitHubPages
    displayName: '2. Deploy to GitHub Pages'
    dependsOn: BuildAndPackage
    condition: succeeded()
    jobs:
      - job: DeployJob
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Website Artifact'
            inputs:
              artifact: 'drop-website'
              path: '$(Pipeline.Workspace)/downloaded-site'

          - script: |
              git config --global user.name "Azure DevOps Pipeline"
              git config --global user.email "azurepipeline@://azure.com"
              
              cd $(Pipeline.Workspace)/downloaded-site
              git init
              git add .
              git commit -m "Automated deployment from Azure Pipeline Run $(Build.BuildId)"
              
              # We use $MAPPED_PAT here instead of the direct variable
              git push --force https://$MAPPED_PAT@://
